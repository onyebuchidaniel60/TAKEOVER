<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #faf6ec;
          overflow: hidden;
          font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #f3-ground {
          position: absolute;
          inset: 0;
          background: #faf6ec;
        }
        #f3-kicker {
          position: absolute;
          top: 48px;
          left: 0;
          width: 1920px;
          text-align: center;
          font-family: ui-monospace, Consolas, monospace;
          font-size: 26px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #6f5e4a;
        }
        #f3-window {
          position: absolute;
          top: 120px;
          left: 360px;
          width: 1200px;
          height: 730px;
          overflow: hidden;
          border: 1px solid #d8c8a8;
          border-radius: 24px;
          background: #faf6ec;
        }
        #f3-plate {
          position: absolute;
          top: 0;
          left: 0;
          width: 1200px;
          height: 1226px;
        }
        #f3-plate img {
          display: block;
          width: 1200px;
          height: 1226px;
        }
        #f3-caption {
          position: absolute;
          top: 868px;
          left: 0;
          width: 1920px;
          text-align: center;
          font-size: 34px;
          color: #5f4f3b;
        }
      </style>

      <div id="root" data-composition-id="03-feed" data-width="1920" data-height="1080">
        <div id="f3-ground" class="clip" data-start="0" data-duration="9.5"></div>
        <div id="f3-kicker">Available now</div>
        <div id="f3-window" data-layout-allow-overflow>
          <div id="f3-plate"><img src="assets/feed-full.png" alt="TAKEOVER live feed" /></div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#f3-kicker", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power3.out" }, 0.1);
          tl.fromTo("#f3-window", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.2);
          tl.fromTo("#f3-plate", { y: 0 }, { y: -380, duration: 4.2, ease: "power2.inOut" }, 1.8);
          window.__timelines["03-feed"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
