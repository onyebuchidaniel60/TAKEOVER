<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #faf6ec;
          overflow: hidden;
          font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #f10-ground {
          position: absolute;
          inset: 0;
          background: #faf6ec;
        }
        #f10-center {
          position: absolute;
          top: 0;
          left: 0;
          width: 1920px;
          height: 895px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #f10-mark {
          width: 120px;
          height: 120px;
          border-radius: 28px;
          overflow: hidden;
        }
        #f10-mark img {
          display: block;
          width: 120px;
          height: 120px;
        }
        #f10-name {
          margin-top: 28px;
          font-family: Georgia, "Times New Roman", serif;
          font-size: 96px;
          letter-spacing: -0.02em;
          font-weight: 700;
          color: #453727;
        }
        #f10-url {
          margin-top: 24px;
          font-family: ui-monospace, Consolas, monospace;
          font-size: 40px;
          letter-spacing: 0.01em;
          color: #9d5a30;
        }
        #f10-mit {
          margin-top: 26px;
          font-size: 28px;
          color: #6f5e4a;
        }
      </style>

      <div id="root" data-composition-id="10-endcard" data-width="1920" data-height="1080">
        <div id="f10-ground" class="clip" data-start="0" data-duration="9"></div>
        <div id="f10-center">
          <div id="f10-mark"><img src="assets/icon-512.png" alt="TAKEOVER app icon" /></div>
          <div id="f10-name">TAKEOVER</div>
          <div id="f10-url">takeover-web-gamma.vercel.app</div>
          <div id="f10-mit">MIT licensed · Built on Nimiq Pay</div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#f10-mark", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" }, 0.1);
          tl.fromTo("#f10-name", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 0.3);
          tl.fromTo("#f10-url", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 1.5);
          tl.fromTo("#f10-mit", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power3.out" }, 3.2);
          window.__timelines["10-endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
