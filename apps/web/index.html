<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAKEOVER — last-minute availability, claimed</title>
    <meta
      name="description"
      content="TAKEOVER is the last-minute marketplace for released capacity. See what's available, claim your slot, and pay safely — providers deliver, you confirm."
    />
    <meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <!-- Phase 14l-3: resolve the theme before first paint (same storage key
         the theme store uses) so a dark-mode reload never flashes light. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('takeover-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Private mode / no storage: fall through to light. */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="TAKEOVER" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="TAKEOVER — last-minute availability, claimed"
    />
    <meta
      property="og:description"
      content="Something valuable just became available. Claim it before it’s gone."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
