[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

# Pinned toolchain version. OZ v5 needs ^0.8.20; 0.8.28 is a
# recent 0.8.x with Cancun+ EVM support for OZ v5's transient
# ReentrancyGuard. Deployment target for the testnet runs was Polygon Amoy (80002).
solc = "0.8.28"

# Optimizer: the escrow entry points run a few times per escrow, so
# runs=200 balances deployment size against call cost. No Yul/IR pipeline
# (keeps builds reproducible across the pinned solc).
optimizer = true
optimizer_runs = 200

# Invariant campaigns stay small: the escrow state space is tiny and the
# handler reverts on invalid actions by design (fail_on_revert=false).
[profile.default.invariant]
runs = 128
depth = 15
fail_on_revert = false
